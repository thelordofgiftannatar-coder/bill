<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' vault: data:; media-src vault:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Definitive 1# PC — Vault</title>
<style>
:root{--or:#ff7900;--bg:#0a0c0f;--chip:#302016;--mu:#b9a99b;--fg:#f7f3ef;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0a0c0fe8;backdrop-filter:blur(10px);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
h1{font-size:20px;margin:0 12px 0 0;color:var(--or)}
button,input{font:inherit;color:inherit;background:var(--chip);border:0;border-radius:20px;padding:9px 16px;cursor:pointer}
button.on{background:var(--or);color:#000;font-weight:700}input{cursor:text;min-width:180px}
#info{color:var(--mu);margin-left:auto}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;padding:12px 16px 80px}
.c{position:relative;aspect-ratio:16/10;background:#14100c;border-radius:10px;overflow:hidden;cursor:pointer}
.c img,.c video{width:100%;height:100%;object-fit:cover;display:block}
.c span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:11px;background:linear-gradient(transparent,#000c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:.15s}
.c:hover span{opacity:1}
#drop{position:fixed;inset:0;display:none;place-items:center;background:#000b;font-size:28px;z-index:9;border:3px dashed var(--or)}
#view{position:fixed;inset:0;background:#000e;display:none;place-items:center;z-index:8}
#view img,#view video{max-width:96vw;max-height:94vh}
#more{height:1px}
</style></head><body>
<header>
  <h1>Vault</h1>
  <button data-c="wallpapers" class="on">Wallpapers</button>
  <button data-c="gifs">GIFs</button>
  <button data-c="gifs-4k">4K GIFs</button>
  <input id="q" placeholder="Search…">
  <button id="add">+ Add files</button>
  <button id="addf">+ Import folder</button>
  <button id="open">Open folder</button>
  <span id="info"></span>
</header>
<div id="grid"></div><div id="more"></div>
<div id="drop">Drop files to add</div><div id="view"></div>
<script>
const V = window.nightcity.vault, PAGE = 120;
let cat = 'wallpapers', q = '', offset = 0, total = 0, loading = false;
const grid = document.getElementById('grid'), info = document.getElementById('info');

async function load(reset) {
  if (loading) return; loading = true;
  if (reset) { grid.innerHTML = ''; offset = 0; }
  const r = await V.list(cat, { offset, limit: PAGE, q });
  total = r.total; offset += r.items.length;
  for (const it of r.items) {
    const c = document.createElement('div'); c.className = 'c';
    const vid = /\.(mp4|webm)$/i.test(it.name);
    const el = document.createElement(vid ? 'video' : 'img');
    if (vid) { el.muted = true; el.loop = true; el.preload = 'metadata'; c.onmouseenter = () => el.play(); c.onmouseleave = () => el.pause(); }
    else el.loading = 'lazy', el.decoding = 'async';
    el.src = it.url; c.append(el);
    const s = document.createElement('span'); s.textContent = it.name; c.append(s);
    c.onclick = () => show(it.url, vid);
    grid.append(c);
  }
  info.textContent = `${offset} / ${total}`;
  loading = false;
}
function show(url, vid) {
  const v = document.getElementById('view'); v.innerHTML = '';
  const el = document.createElement(vid ? 'video' : 'img'); el.src = url;
  if (vid) { el.controls = true; el.autoplay = true; el.loop = true; }
  v.append(el); v.style.display = 'grid'; v.onclick = () => { v.style.display = 'none'; v.innerHTML = ''; };
}
new IntersectionObserver(e => { if (e[0].isIntersecting && offset < total) load(); }, { rootMargin: '800px' })
  .observe(document.getElementById('more'));

document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-c]').forEach(x => x.classList.remove('on')); b.classList.add('on');
  cat = b.dataset.c; load(true);
});
let t; document.getElementById('q').oninput = e => { clearTimeout(t); t = setTimeout(() => { q = e.target.value; load(true); }, 250); };
document.getElementById('add').onclick = async () => { await V.import(cat); load(true); };
document.getElementById('addf').onclick = async () => { await V.importFolder(cat); load(true); };
document.getElementById('open').onclick = () => V.openFolder(cat);

const drop = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'grid'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) drop.style.display = 'none'; });
addEventListener('drop', async e => { e.preventDefault(); drop.style.display = 'none'; await V.drop(cat, e.dataTransfer.files); load(true); });
load(true);
</script></body></html>
